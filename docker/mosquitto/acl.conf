# Mosquitto ACL — deny-by-default. Rules above the first `user` line apply
# only to anonymous (no-username) clients; each `user` block is
# independent and must repeat every rule it needs — nothing is inherited
# from the anonymous block (verified against the official
# aclfile.example).
#
# Multi-vehicle topic scheme (see shared/src/mqtt/topics.ts): the three
# backend->bot TARGETED topics (handshake/response, command, video/
# control) use a wildcard `topic` directive (`+` in the vin position) —
# Mosquitto's plain `topic` directive supports `+`/`#` wildcards natively,
# no `pattern`/`%c`/`%u` substitution needed. `pattern` remains
# deliberately unused: it only helps once a connecting client has a
# distinguishing identity to substitute (%c/%u), and per the
# client-confirmed "bots implement no security of their own" decision
# (CLAUDE.md), anonymous bots have none — pattern was never the right
# tool here. The other five topics stay single fixed-literal lines (just
# renamed, `AUTO` dropped) since they were never per-vin — every bot uses
# the identical literal string, so no wildcard is needed there.
#
# IMPORTANT: the wildcard is a topic-*shape* restriction, not an identity
# restriction — it does not change the already-accepted residual risk
# that any anonymous client can still self-declare and publish as any
# vin (this applies equally to the fixed topics below, unchanged from
# today). True per-vin publish restriction would require per-bot
# credentials, which is out of scope here — it would reverse the
# client's own no-bot-auth decision and needs a separate decision from
# them, not just a topic/ACL change.

# Anonymous clients — bots. $SYS read is required for the existing
# Docker healthcheck (mosquitto_sub -t '$SYS/#'), which also connects
# anonymously — omitting this would silently break a currently-working
# healthcheck the moment this ACL file is introduced.
topic read $SYS/#

# Fixed topics — bot->backend, bot team confirmed Aug 2026 for handshake
# (see shared/src/mqtt/topics.ts MQTT_TOPICS_INBOUND.handshakeRequest).
topic write robot/handshake/request
# Targeted, per-vin — backend->bot, one delivery only reaches the bot
# subscribed to its own vin's topic.
topic read robot/+/handshake/response
# Deadman-switch heartbeat (backend-published, fleet-wide broadcast, no
# vin) — see MQTT_TOPICS heartbeat.
topic read robot/heartbeat
# Telemetry — bot->backend, fixed/shared.
topic write robot/telemetry
# e-stop/resume — targeted, per-vin. Bots may only ever READ this
# (never write) — a Mosquitto ACL restricting publish to the
# backend-service identity below is the one exception to the no-bot-auth
# model, preventing an unauthenticated client from injecting a forged
# e-stop/resume command (see CLAUDE.md's "Bot identity & the no-auth
# decision").
topic read robot/+/command
# Stop event — bot->backend, fixed/shared. Every "vehicle stopped"
# scenario reports through this one topic; cause distinguishes which.
topic write robot/stop-event
# Live video — targeted, per-vin control (backend->bot), fixed/shared
# status report back (bot->backend).
topic read robot/+/video/control
topic write robot/video/status

# backend-service — the only identity allowed to publish e-stop/resume
# commands, handshake acks, the heartbeat, and video control. Nothing
# above is inherited; every topic it needs is repeated.
# Also given read access to its own published topics (handshake/response,
# heartbeat, command, video/control) so the load-test observer (which
# connects as backend-service) can subscribe to them and verify correctness
# end-to-end — the observer needs both halves of the protocol (bot->backend
# *and* backend->bot) to validate per-VIN handshake ack delivery, video
# command/status pairing, etc.
user backend-service
topic read robot/handshake/request
topic readwrite robot/+/handshake/response
topic readwrite robot/heartbeat
topic read robot/telemetry
topic readwrite robot/+/command
topic read robot/stop-event
topic readwrite robot/+/video/control
topic read robot/video/status
