# Anonymous connections are intentional, not a dev-only leftover: the
# client confirmed Aug 2026 that bots implement no security of their own
# (see CLAUDE.md "Bot identity & the no-auth decision"). Identity is the
# VIN self-declared in the payload, never verified at the broker.
#
# acl_file (below) restricts *publish* on vehicles/+/command to the
# backend's own authenticated connection (username "backend-service"),
# so an anonymous client can't inject a forged e-stop/resume command.
# Anonymous connections still publish telemetry/session/stop-event and
# subscribe to command — no auth requirement beyond that one ACL rule.
# password_file is generated at container start by entrypoint.sh from
# MOSQUITTO_BACKEND_PASSWORD (docker/.env, gitignored) — never committed.
# acl_file is also placed there (copied in by entrypoint.sh from a
# read-only source mount) rather than referenced at its original
# bind-mounted path — see entrypoint.sh for why.

listener 1883

listener 9001
protocol websockets

allow_anonymous true
password_file /mosquitto/runtime/passwd
acl_file /mosquitto/runtime/acl.conf

persistence true
persistence_location /mosquitto/data/
log_dest stdout
